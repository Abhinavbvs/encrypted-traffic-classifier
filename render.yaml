services:
  # MetaFlow Landing Site & Live REST API
  - type: web
    name: metaflow-web
    runtime: python
    buildCommand: pip install -r requirements.txt && python web/build.py
    startCommand: python web/server.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: METAFLOW_EXPLAINER
        value: auto

  # Streamlit Interactive Dashboard
  - type: web
    name: metaflow-streamlit
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
