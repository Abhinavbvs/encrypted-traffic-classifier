version: '3.8'

services:
  # Unified MetaFlow Monorepo Service (Port 8600):
  #   - MetaFlow Web UI & REST API: http://localhost:8600/
  #   - Embedded Streamlit Studio: http://localhost:8600/studio/
  metaflow:
    build: .
    container_name: metaflow
    command: ["python", "web/server.py", "--host", "0.0.0.0", "--port", "8600"]
    ports:
      - "8600:8600"
    environment:
      - PYTHONUNBUFFERED=1
      - METAFLOW_STUDIO_MODE=eager
      - OLLAMA_HOST=http://host.docker.internal:11434
    restart: unless-stopped
